name: Android Build and Release

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Make Gradle launcher executable
        run: chmod +x gradlew

      - name: Resolve app version
        id: version
        run: |
          set -euo pipefail
          CODE="$(sed -n 's/^versionCode=//p' gradle.properties | tr -d '\r')"
          NAME="$(sed -n 's/^versionName=//p' gradle.properties | tr -d '\r')"
          test -n "$CODE" || { echo "::error::versionCode missing from gradle.properties"; exit 1; }
          test -n "$NAME" || { echo "::error::versionName missing from gradle.properties"; exit 1; }
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "App version: $NAME (code $CODE)"

      - name: Run unit tests
        run: ./gradlew test

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocket-proj-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Kept because a real crash shipped without it: the biometric prompt called
      # Context.getMainExecutor (API 28) against a minSdk of 26, so Android 8.0 and 8.1
      # died with NoSuchMethodError on the tap. `test` and `assembleDebug` were both green
      # the whole time, across at least eight releases -- neither can see an API-level
      # mismatch. Only static analysis can.
      #
      # Default severity, deliberately: lint fails on errors and not on warnings. The
      # 16 current warnings are dependency-update notices, the kapt-vs-KSP suggestion and
      # deprecated-attribute advice, and failing CI over them would train people to ignore
      # a red build. Any new *error* blocks the merge, which is the point.
      #
      # Placed after the debug artifact upload so a lint failure does not also cost the
      # build, and before the release gate so a bad merge never reaches a release at all.
      - name: Run Android lint
        run: ./gradlew lint

      - name: Decide whether to publish a release
        id: release_gate
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_CODE: ${{ steps.version.outputs.code }}
          CURRENT_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail

          # Publishing on every merge to main produced six releases for three versions
          # (0.3.3 as build-311/313/315, 0.3.4 as build-319/321/323), and made the version
          # name ambiguous: later artifacts carried fixes earlier ones did not, all under
          # one name. It also cost a version-bump PR after every batch of PRs, since
          # versionCode is the only signal Android's installer reads and an unchanged one
          # means nobody can install the result.
          #
          # So a merge publishes only when versionCode actually moved. The build, the unit
          # tests and the debug APK still run on every push and every PR either way --
          # this gates publishing, not verification.
          #
          # Fails open. Every ambiguous case publishes, because a gate that cannot read
          # the previous version must never be the reason a release silently stops.

          LATEST_TAG="$(gh release view --json tagName -q .tagName 2>/dev/null || true)"
          if [ -z "$LATEST_TAG" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "No previous release found. Publishing $CURRENT_NAME."
            exit 0
          fi

          # actions/checkout defaults to a shallow clone with no tags, so the previous
          # release's gradle.properties is not here yet.
          git fetch --quiet --tags origin

          if ! git cat-file -e "$LATEST_TAG^{commit}" 2>/dev/null; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Tag $LATEST_TAG is not in this checkout; cannot compare. Publishing $CURRENT_NAME."
            exit 0
          fi

          PREVIOUS_CODE="$(git show "$LATEST_TAG:gradle.properties" 2>/dev/null \
            | sed -n 's/^versionCode=//p' | tr -d '[:space:]' || true)"
          if [ -z "$PREVIOUS_CODE" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not read versionCode from $LATEST_TAG; cannot compare. Publishing $CURRENT_NAME."
            exit 0
          fi

          if [ "$CURRENT_CODE" != "$PREVIOUS_CODE" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "versionCode $PREVIOUS_CODE -> $CURRENT_CODE. Publishing $CURRENT_NAME."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "versionCode is still $CURRENT_CODE, unchanged since $LATEST_TAG."
            echo "Build, tests and the debug APK all ran. Skipping the release because the"
            echo "version did not change; bump versionCode in gradle.properties to cut one."
          fi

      - name: Prepare release signing
        if: steps.release_gate.outputs.publish == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.POCKET_RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Missing POCKET_RELEASE_KEYSTORE_B64. Configure the four POCKET_RELEASE_* repository secrets before publishing signed updates."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pocket-proj-release.jks"
          echo "POCKET_RELEASE_KEYSTORE=$RUNNER_TEMP/pocket-proj-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: steps.release_gate.outputs.publish == 'true'
        env:
          POCKET_RELEASE_STORE_PASSWORD: ${{ secrets.POCKET_RELEASE_STORE_PASSWORD }}
          POCKET_RELEASE_KEY_ALIAS: ${{ secrets.POCKET_RELEASE_KEY_ALIAS }}
          POCKET_RELEASE_KEY_PASSWORD: ${{ secrets.POCKET_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$POCKET_RELEASE_STORE_PASSWORD" || (echo "::error::Missing POCKET_RELEASE_STORE_PASSWORD" && exit 1)
          test -n "$POCKET_RELEASE_KEY_ALIAS" || (echo "::error::Missing POCKET_RELEASE_KEY_ALIAS" && exit 1)
          test -n "$POCKET_RELEASE_KEY_PASSWORD" || (echo "::error::Missing POCKET_RELEASE_KEY_PASSWORD" && exit 1)
          ./gradlew assembleRelease \
            -PversionCode="${{ steps.version.outputs.code }}" \
            -PversionName="${{ steps.version.outputs.name }}"

      - name: Verify release APK version
        if: steps.release_gate.outputs.publish == 'true'
        env:
          EXPECTED_CODE: ${{ steps.version.outputs.code }}
          EXPECTED_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)"
          test -n "$AAPT2" || { echo "::error::aapt2 not found under ANDROID_HOME"; exit 1; }
          for apk in app/build/outputs/apk/release/*.apk; do
            BADGING="$("$AAPT2" dump badging "$apk")"
            ACTUAL_CODE="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<<"$BADGING")"
            ACTUAL_NAME="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING")"
            echo "$apk -> versionCode=$ACTUAL_CODE versionName=$ACTUAL_NAME"
            if [ "$ACTUAL_CODE" != "$EXPECTED_CODE" ] || [ "$ACTUAL_NAME" != "$EXPECTED_NAME" ]; then
              echo "::error::APK version does not match gradle.properties (expected $EXPECTED_NAME/$EXPECTED_CODE)"
              exit 1
            fi
          done

      - name: Upload signed release APK artifact
        if: steps.release_gate.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pocket-proj-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Compose release notes
        if: steps.release_gate.outputs.publish == 'true'
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          # Keep the build-<run_number> tag so existing release links and
          # compare URLs stay valid, but put the real version name in the
          # release title where a human will actually look for it.
          {
            echo "## What's changed in $APP_VERSION_NAME"
            echo
            # Body of the newest CHANGELOG section only: everything between the
            # first "## [" heading and the next one.
            awk '/^## \[/ { n++; if (n > 1) exit; next } n == 1 { print }' CHANGELOG.md
            echo
            echo "---"
            echo
            echo "**Version** \`$APP_VERSION_NAME\` (versionCode \`$APP_VERSION_CODE\`)"
            echo "**Build** [\`build-${{ github.run_number }}\`](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo
            echo "Install \`app-release.apk\` over an existing install — the signing key is unchanged."
          } > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Publish signed GitHub release for main
        if: steps.release_gate.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Voket ${{ steps.version.outputs.name }} (build ${{ github.run_number }})"
          body_path: ${{ runner.temp }}/release-notes.md
          files: app/build/outputs/apk/release/*.apk
