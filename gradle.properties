org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Single source of truth for the published app version. CI reads these to name
# the GitHub release, and .github/workflows/android-build-release.yml fails the
# release if the built APK does not match. Keep versionCode strictly increasing:
# Android refuses to upgrade an install whose versionCode has not moved.
versionCode=9
versionName=0.3.6
